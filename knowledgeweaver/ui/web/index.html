<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Courier+Prime:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <title>KnowledgeWeaver — AI Research Synthesis</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf8f4;
      --card: #fefcf8;
      --primary: #8b6914;
      --primary-hover: #7a5c10;
      --success: #4a9e4a;
      --success-text: #2d6a2d;
      --error: #8b2020;
      --warning: #7a5010;
      --text: #1a1209;
      --muted: #6b5c3e;
      --border: rgba(139,105,20,0.12);
      --rule: #c9a84c;
      --radius-card: 6px;
      --radius-input: 4px;
      --radius-badge: 4px;
      --shadow-card: 0 1px 4px rgba(139,105,20,0.08), 0 0 0 1px rgba(139,105,20,0.06);
      --mono: 'Courier Prime', 'Courier New', monospace;
      --serif: 'EB Garamond', Georgia, serif;
      --display: 'Cormorant Garamond', Georgia, serif;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display',
                   'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    header {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .logo-icon {
      width: 26px; height: 26px;
      background: linear-gradient(135deg, #0071e3, #34aadc);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      font-size: 13px;
      flex-shrink: 0;
    }

    .active-indicator {
      display: none;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--primary);
      background: rgba(0,113,227,0.08);
      padding: 3px 10px;
      border-radius: var(--radius-badge);
    }
    .active-indicator .pulse-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--primary);
      animation: pulse 1.4s ease-in-out infinite;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 28px;
      margin-bottom: 20px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .explore-prompt {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .query-input {
      flex: 1;
      padding: 11px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-input);
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .query-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0,113,227,0.25);
      background: #fff;
    }
    .query-input::placeholder { color: var(--muted); }

    .btn-explore {
      padding: 11px 22px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-badge);
      font-size: 0.9rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, transform .1s, opacity .15s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-explore:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-explore:active:not(:disabled) { transform: scale(.97); }
    .btn-explore:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Bubble cloud ── */
    .cloud-section { margin-top: 24px; }
    .cloud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .cloud-refresh {
      font-size: 0.75rem;
      color: var(--primary);
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      padding: 3px 8px;
      border-radius: 6px;
      transition: background .12s;
    }
    .cloud-refresh:hover { background: rgba(0,113,227,0.08); }

    #word-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      padding: 16px 0;
      min-height: 160px;
    }
    .cloud-loading {
      color: var(--muted);
      font-size: 0.85rem;
      font-style: italic;
    }

    .bubble {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 500;
      text-align: center;
      line-height: 1.2;
      padding: 4px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: bubbleFloat var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
      word-break: break-word;
      hyphens: auto;
    }
    .bubble:hover {
      transform: scale(1.12) !important;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15) !important;
    }
    .bubble:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }
    @keyframes bubbleFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50%       { transform: translateY(-6px) scale(1.02); }
    }

    /* ── Query list ── */
    .library-heading {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }
    #query-list { display: flex; flex-direction: column; }
    .empty-state {
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      padding: 32px 0;
    }

    .query-card {
      padding: 14px 16px;
      background: transparent;
      transition: background .12s;
      position: relative;
      overflow: hidden;
    }
    .query-card + .query-card {
      border-top: 1px solid rgba(0,0,0,0.06);
    }
    .query-card:hover { background: rgba(0,0,0,0.02); }

    .query-card-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot-pending    { background: var(--muted); }
    .status-dot-processing { background: var(--primary); animation: pulse 1.4s ease-in-out infinite; }
    .status-dot-completed  { background: var(--success); }
    .status-dot-failed     { background: var(--error); }

    .query-text {
      font-weight: 600;
      font-size: 0.93rem;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
    .query-card-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .query-timestamp {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
    }

    .query-card-bottom {
      margin-top: 6px;
      padding-left: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .query-progress {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
    }
    .query-report {
      font-size: 0.82rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }
    .query-report:hover { text-decoration: underline; }
    .query-error {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--error);
    }

    .progress-bar-track {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: rgba(0,113,227,0.1);
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      animation: progressIndeterminate 1.8s ease-in-out infinite;
      transform-origin: left;
    }
    @keyframes progressIndeterminate {
      0%   { transform: scaleX(0); margin-left: 0; }
      50%  { transform: scaleX(0.6); margin-left: 20%; }
      100% { transform: scaleX(0); margin-left: 100%; }
    }

    /* ── Status badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: var(--radius-badge);
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-pending    { background: rgba(110,110,115,0.12); color: var(--muted); }
    .badge-processing { background: rgba(0,113,227,0.1);   color: var(--primary); }
    .badge-completed  { background: rgba(52,199,89,0.12);  color: var(--success-text); }
    .badge-failed     { background: rgba(255,59,48,0.1);   color: var(--error); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .4; transform: scale(.7); }
    }

    /* ── Toast notifications ── */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      padding: 11px 16px;
      border-radius: var(--radius-input);
      font-size: 0.85rem;
      font-weight: 500;
      color: #fff;
      max-width: 320px;
      box-shadow: 0 4px 16px rgba(0,0,0,.18);
      animation: slideIn .25s ease-out forwards;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.toast-success { background: #1a7f37; }
    .toast.toast-error   { background: var(--error); }
    .toast.toast-info    { background: var(--primary); }
    .toast.toast-hide    { animation: slideOut .25s ease-in forwards; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(60px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideOut {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(60px); }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon" aria-hidden="true">&#x25C8;</div>
    <span>KnowledgeWeaver</span>
  </div>
  <span class="active-indicator" id="activeIndicator">
    <span class="pulse-dot" aria-hidden="true"></span>
    <span id="activeCount">0</span> processing
  </span>
</header>

<main>
  <!-- Explore card -->
  <section class="card" aria-labelledby="explore-heading">
    <p class="section-label">Explore</p>
    <h1 class="explore-prompt" id="explore-heading">What do you want to explore?</h1>
    <div class="input-row">
      <input
        id="query-input"
        class="query-input"
        type="text"
        placeholder="e.g. quantum computing, CRISPR, climate change..."
        aria-label="Research topic"
        autocomplete="off"
      />
      <button id="btn-explore" class="btn-explore" disabled aria-label="Start research">
        Explore &#x2192;
      </button>
    </div>
    <div class="cloud-section">
      <div class="cloud-header">
        <span class="section-label" style="margin-bottom:0">Suggested Topics</span>
        <button class="cloud-refresh" id="btn-refresh-cloud" aria-label="Refresh suggestions">
          &#x21bb; Refresh
        </button>
      </div>
      <div id="word-cloud" role="list" aria-label="Suggested topics">
        <span class="cloud-loading">Loading suggestions...</span>
      </div>
    </div>
  </section>

  <!-- Research Library card -->
  <section class="card" aria-labelledby="library-heading">
    <p class="section-label">Research Library</p>
    <h2 class="library-heading" id="library-heading">Research History</h2>
    <div id="query-list" role="list" aria-live="polite" aria-label="Research history">
      <p class="empty-state">No research yet. Enter a topic above to get started.</p>
    </div>
  </section>
</main>

<div id="toast-container" aria-live="assertive" aria-atomic="true"></div>

<script>
'use strict';

// ── Utilities ────────────────────────────────────────────────────────────────

function timeAgo(isoString) {
  const date = new Date(isoString);
  const now = new Date();
  const secs = Math.floor((now - date) / 1000);
  if (secs < 60)  return 'just now';
  if (secs < 3600) return `${Math.floor(secs / 60)} min ago`;
  if (secs < 86400) return `${Math.floor(secs / 3600)} hour${Math.floor(secs/3600)>1?'s':''} ago`;
  return date.toLocaleDateString();
}

function truncate(str, max) {
  return str.length > max ? str.slice(0, max) + '…' : str;
}

// ── Toast ─────────────────────────────────────────────────────────────────────

function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.setAttribute('role', 'alert');
  const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
  toast.innerHTML = `<span aria-hidden="true">${icon}</span><span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('toast-hide');
    toast.addEventListener('animationend', () => toast.remove(), { once: true });
  }, 4000);
}

// ── Active indicator ──────────────────────────────────────────────────────────

function updateActiveIndicator(queries) {
  const count = (queries || []).filter(q => q.status === 'processing').length;
  const el = document.getElementById('activeIndicator');
  const countEl = document.getElementById('activeCount');
  if (count > 0) {
    countEl.textContent = count;
    el.style.display = 'inline-flex';
  } else {
    el.style.display = 'none';
  }
}

// ── Bubble cloud ──────────────────────────────────────────────────────────────

const BUBBLE_SCHEMES = [
  { bg: '#e8f0fe', text: '#1a56db' },
  { bg: '#fce7f3', text: '#9d174d' },
  { bg: '#d1fae5', text: '#065f46' },
  { bg: '#fef3c7', text: '#92400e' },
  { bg: '#ede9fe', text: '#5b21b6' },
  { bg: '#e0f2fe', text: '#0c4a6e' },
];

function bubbleSizeForWeight(w) {
  if (w <= 2) return { size: 64, font: '0.65rem' };
  if (w <= 4) return { size: 76, font: '0.72rem' };
  if (w <= 6) return { size: 90, font: '0.8rem' };
  if (w <= 8) return { size: 108, font: '0.88rem' };
  return { size: 128, font: '0.95rem' };
}

function renderWordCloud(keywords) {
  const container = document.getElementById('word-cloud');
  container.innerHTML = '';
  if (!keywords || keywords.length === 0) {
    container.innerHTML = '<span class="cloud-loading">No suggestions available.</span>';
    return;
  }
  keywords.forEach((kw, i) => {
    const scheme = BUBBLE_SCHEMES[i % BUBBLE_SCHEMES.length];
    const { size, font } = bubbleSizeForWeight(kw.weight || 5);
    const dur = (2.5 + Math.random() * 1.5).toFixed(2) + 's';
    const delay = (Math.random() * 2).toFixed(2) + 's';

    const bubble = document.createElement('span');
    bubble.className = 'bubble';
    bubble.setAttribute('role', 'listitem');
    bubble.setAttribute('tabindex', '0');
    bubble.setAttribute('aria-label', `Suggested topic: ${kw.word}`);
    bubble.textContent = kw.word;
    bubble.style.cssText = [
      `width:${size}px`,
      `height:${size}px`,
      `background:${scheme.bg}`,
      `color:${scheme.text}`,
      `font-size:${font}`,
      `--dur:${dur}`,
      `--delay:${delay}`,
    ].join(';');

    bubble.addEventListener('click', () => {
      document.getElementById('query-input').value = kw.word;
      document.getElementById('query-input').dispatchEvent(new Event('input'));
      document.getElementById('query-input').focus();
    });
    bubble.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); bubble.click(); }
    });
    container.appendChild(bubble);
  });
}

async function fetchKeywords() {
  try {
    const res = await fetch('/api/recommendations');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderWordCloud(data.keywords || []);
  } catch (err) {
    document.getElementById('word-cloud').innerHTML =
      '<span class="cloud-loading">Could not load suggestions.</span>';
  }
}

// ── Query rendering ───────────────────────────────────────────────────────────

function buildBadge(status) {
  const badge = document.createElement('span');
  badge.className = `badge badge-${status === 'completed' ? 'completed' : status === 'processing' ? 'processing' : status === 'failed' ? 'failed' : 'pending'}`;
  if (status === 'pending') {
    badge.textContent = 'pending';
  } else if (status === 'processing') {
    const dot = document.createElement('span');
    dot.className = 'pulse-dot';
    dot.setAttribute('aria-hidden', 'true');
    badge.appendChild(dot);
    badge.appendChild(document.createTextNode('processing'));
  } else if (status === 'completed') {
    badge.textContent = 'done';
  } else {
    badge.textContent = 'failed';
  }
  return badge;
}

function renderQueryCard(query) {
  const card = document.createElement('div');
  card.className = 'query-card';
  card.setAttribute('role', 'listitem');
  card.dataset.queryId = query.query_id;

  // Top row: dot + text + badge + timestamp
  const top = document.createElement('div');
  top.className = 'query-card-top';

  const dot = document.createElement('span');
  dot.className = `status-dot status-dot-${query.status === 'completed' ? 'completed' : query.status === 'processing' ? 'processing' : query.status === 'failed' ? 'failed' : 'pending'}`;
  dot.setAttribute('aria-hidden', 'true');

  const textEl = document.createElement('div');
  textEl.className = 'query-text';
  textEl.textContent = truncate(query.query_text, 80);
  textEl.title = query.query_text;

  const right = document.createElement('div');
  right.className = 'query-card-right';

  right.appendChild(buildBadge(query.status));

  if (query.created_at) {
    const ts = document.createElement('span');
    ts.className = 'query-timestamp';
    ts.textContent = timeAgo(query.created_at);
    right.appendChild(ts);
  }

  top.appendChild(dot);
  top.appendChild(textEl);
  top.appendChild(right);
  card.appendChild(top);

  // Bottom row: progress / report / error
  const hasBottom = (query.status === 'processing' && query.progress_message)
    || (query.status === 'completed' && query.result_path)
    || query.status === 'failed';

  if (hasBottom) {
    const bottom = document.createElement('div');
    bottom.className = 'query-card-bottom';

    if (query.status === 'processing' && query.progress_message) {
      const prog = document.createElement('span');
      prog.className = 'query-progress';
      prog.textContent = query.progress_message;
      bottom.appendChild(prog);
    }

    if (query.status === 'completed' && query.result_path) {
      const link = document.createElement('a');
      link.className = 'query-report';
      link.href = `/outputs/${query.result_path}`;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = 'Open Report ↗';
      bottom.appendChild(link);
    }

    if (query.status === 'failed') {
      const errEl = document.createElement('span');
      errEl.className = 'query-error';
      errEl.textContent = query.progress_message || 'Research failed. Please try again.';
      bottom.appendChild(errEl);
    }

    card.appendChild(bottom);
  }

  // Animated progress bar for processing
  if (query.status === 'processing') {
    const track = document.createElement('div');
    track.className = 'progress-bar-track';
    const fill = document.createElement('div');
    fill.className = 'progress-bar-fill';
    track.appendChild(fill);
    card.appendChild(track);
  }

  return card;
}

function renderQueryList(queries) {
  const list = document.getElementById('query-list');
  if (!queries || queries.length === 0) {
    list.innerHTML = '<p class="empty-state">No research yet. Enter a topic above to get started.</p>';
    return;
  }
  const sorted = [...queries].sort(
    (a, b) => new Date(b.created_at) - new Date(a.created_at)
  );
  list.innerHTML = '';
  sorted.forEach(q => list.appendChild(renderQueryCard(q)));
}

// ── API calls ─────────────────────────────────────────────────────────────────

let prevStatuses = {};

async function fetchQueries() {
  try {
    const res = await fetch('/api/queries');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const queries = await res.json();
    queries.forEach(q => {
      const prev = prevStatuses[q.query_id];
      if (prev && prev !== 'completed' && q.status === 'completed') {
        showToast(`Research complete: ${truncate(q.query_text, 40)}`, 'success');
      }
      prevStatuses[q.query_id] = q.status;
    });
    renderQueryList(queries);
    updateActiveIndicator(queries);
  } catch (err) {
    showToast('Could not load research history.', 'error');
  }
}

async function submitQuery(queryText) {
  const btn = document.getElementById('btn-explore');
  btn.disabled = true;
  try {
    const res = await fetch('/api/queries', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query_text: queryText, depth: 'medium' }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    prevStatuses[data.query_id] = data.status;
    document.getElementById('query-input').value = '';
    document.getElementById('query-input').dispatchEvent(new Event('input'));
    showToast('Research started!', 'success');
    await fetchQueries();
  } catch (err) {
    showToast('Failed to start research. Please try again.', 'error');
  } finally {
    const input = document.getElementById('query-input');
    btn.disabled = input.value.trim() === '';
  }
}

// ── Init & polling ────────────────────────────────────────────────────────────

function init() {
  const input = document.getElementById('query-input');
  const btn   = document.getElementById('btn-explore');

  input.addEventListener('input', () => {
    btn.disabled = input.value.trim() === '';
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && input.value.trim() !== '') {
      submitQuery(input.value.trim());
    }
  });

  btn.addEventListener('click', () => {
    if (input.value.trim() !== '') submitQuery(input.value.trim());
  });

  document.getElementById('btn-refresh-cloud').addEventListener('click', fetchKeywords);

  fetchKeywords();
  fetchQueries();

  setInterval(fetchQueries, 3000);
  setInterval(fetchKeywords, 60000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
