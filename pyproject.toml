[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgeweaver"
version = "0.1.0"
description = "A TUI-based AI agent dialogue research system that synthesizes knowledge from multiple authoritative sources"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "KnowledgeWeaver Contributors"}
]

dependencies = [
    "anthropic>=0.28.0",
    "textual>=0.50.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "pdfplumber>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
knowledgeweaver = "knowledgeweaver.__main__:main"

[tool.setuptools]
packages = ["knowledgeweaver"]

[tool.setuptools.package-data]
knowledgeweaver = ["output/templates/*.html", "output/assets/*.css", "output/assets/*.js"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=knowledgeweaver --cov-report=html --cov-report=term-missing"
