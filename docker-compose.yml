version: '3.8'

services:
  knowledgeweaver:
    build: .
    container_name: knowledgeweaver
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-4-7}
      - CONCURRENT_QUERIES=${CONCURRENT_QUERIES:-8}
      - QUERY_TIMEOUT_SECONDS=${QUERY_TIMEOUT_SECONDS:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_PATH=/app/data/knowledgeweaver.db
      - OUTPUT_DIR=/app/output
      - DEBUG=${DEBUG:-false}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - knowledgeweaver-network

networks:
  knowledgeweaver-network:
    driver: bridge
